[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'"
]


[project]
name = "tool-dev-my-first-anna-app"
version = "0.1.0"
description = "Executa for the my-first-anna-app Anna App"
requires-python = ">=3.10, <3.14"
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-deepseek>=0.1.0",
    "youtube-transcript-api>=1.2.4",
    "google-api-python-client>=2.100.0",
    "groq>=0.11.0",
    "deepgram-sdk>=3.0.0",
    "qdrant-client>=1.9.0",       # bundles grpcio/grpcio-tools, so prefer_grpc=True needs nothing extra
    "langchain-qdrant>=0.1.0", 
    "firecrawl-py",
    "python-dotenv",
    "langchain>=1.4.0",
    "yt-dlp[default]>=2026.8.19",
    "ffmpeg-python>=0.2.0",
    "boto3>=1.43.89",
    "fastembed>=0.8.0",              # required for FastEmbedEmbeddings
    "b2sdk>=2.12.0",
    "curl-cffi>=0.16.3",
]

[project.scripts]
"tool-dev-my-first-anna-app" = "bob_plugin:main"

[tool.setuptools]
py-modules = [
    "bob_plugin",
    "main",
    "modes",
    "transcript",
    "search",
    "web_search",
    "metadata",
    "server",
    "stt",
    "tts",
]
